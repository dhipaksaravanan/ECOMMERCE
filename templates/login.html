{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Login - ShopEase</title>

    <link rel="stylesheet" href="{% static 'styles/auth.css' %}">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>Login</h1>

        <p>Login to your ShopEase account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">
                Create Account
            </a>
        </p>

    </div>

</div>

</body>
</html>
